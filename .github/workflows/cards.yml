# GITHUB_TOKEN reaches public repositories. A classic PAT with the repo scope,
# set as GH_STATS_TOKEN, also reaches private ones.

name: 📊 Cards

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - 'assets/fonts/**'
      - '.github/workflows/cards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  render:
    name: 🖼 Render
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🎨 Render cards
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/render.mjs

      - name: 📤 Commit and push
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo 'Cards unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m ':chart_with_upwards_trend: chore: Refresh profile cards'
          git push
